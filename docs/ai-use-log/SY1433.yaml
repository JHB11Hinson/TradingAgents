- id: AI-2026-11-14-001
  date: 2026-11-14
  members: ["SY1433"]
  agent: opencode
  summary: >-
    CHG-021: promote gate-2-static-analysis from "ruff blocking + soft mypy" to a blocking scoped
    static-analysis gate. Replaced the `mypy src || true` tail in .github/workflows/ci.yml with four
    blocking steps: ruff on the src/**/*.py files the PR touches, `pip check` for dependency
    consistency, `mypy --follow-imports=silent` on changed src files, and a skip list that only
    honours files already recorded in docs/code-governance/mypy-legacy.txt. Pinned mypy to 2.4.1 so
    the quarantine baseline reproduces. Recorded the inherited errors as DEBT-009 and the missing
    safety-path and dependency-declaration halves as DEBT-010. No src/ or test/ change; the gate name
    and its branch-protection context stay identical.
  human_interventions:
    - type: approve
      what: >-
        Approved promoting gate-2 to blocking rather than leaving mypy soft, and approved the scoped
        form (changed files only) over a whole-tree run.
      why: >-
        D7 requires lint, type checking and dependency checks to block, but `mypy src` reports 156
        errors in 26 inherited modules; a whole-tree blocking run would turn every pull request red
        and the gate would be reverted within a day.
    - type: constrain
      what: >-
        Required the mypy pin and the mypy-legacy.txt quarantine, and required that new files are
        never on the list.
      why: >-
        Without a pinned mypy the inherited error count drifts and the quarantine stops being
        reproducible; without the "new files are always checked" rule the quarantine silently grows
        to cover the code the team actually writes.
    - type: constrain
      what: >-
        Kept the gate name and the branch-protection context unchanged.
      why: >-
        Renaming the context would break the required-status-check list on main, and every open pull
        request would need the protection list edited by hand.
  transcript: TBD


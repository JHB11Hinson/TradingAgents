  summary: >-
    CHG-028: add docs/code-governance/merge-train.md, the serial integration procedure for a queue of
    pull requests. Documents the preflight a branch must satisfy before it joins the queue, the rule
    that only one conflicting approval may be in flight, and the fact that a conflict resolved after
    approval forces the reviewer to approve again. Documentation only; no src/, test/ or prompts/
    change.
  human_interventions:
    - type: approve
      what: >-
        Approved writing the runbook as a governance document rather than fixing the individual merge
        conflicts as they appeared.
      why: >-
        The conflicts were a pattern, not one-off accidents: each resolution created a new commit,
        which dismissed an approval that had already been given, so the team paid the review cost
        repeatedly. A written procedure made that cost visible and schedulable.
    - type: constrain
      what: >-
        Kept the runbook to read-only preflight steps; no automated merge or force-push helper.
      why: >-
        A helper that merges would move an irreversible action into a script, which contradicts the
        rule that a human decides the merge.
  transcript: TBD


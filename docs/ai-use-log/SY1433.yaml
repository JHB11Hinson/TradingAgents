  summary: >-
    CHG-052: document the evaluator's installed-package trap in README.md section 6 Troubleshooting,
    and pin the claim with five offline tests in test/offline/test_readme_environment_trap.py. Three
    of the five failed on main before the change. The trap: pytest reads src/ through
    `pythonpath = ["src"]` while the evaluator subprocess `python -m eval.run` reads the *installed*
    package, so two checkouts sharing one editable install can run different code. No src/ change.
  human_interventions:
    - type: approve
      what: >-
        Approved adding a Troubleshooting section to the README as the fix, instead of repairing the
        environment or changing the evaluator's import path.
      why: >-
        The failure hits a second checkout, not the primary one, so the durable fix is a written
        diagnostic a future member can follow; changing the import path would alter how the evaluator
        runs for everyone in order to help one scenario.
    - type: correct
      what: >-
        Corrected the first survey's diagnosis, which said the trap affected an ordinary checkout.
        Re-testing in the owner's tree gave 1626 passing tests; the failure only reproduces when two
        checkouts share one editable install. The README and the AI-use log describe the real trigger,
        and the pull request records that the first survey was wrong.
      why: >-
        A troubleshooting section that names the wrong trigger sends the next reader down a path that
        cannot reproduce the problem. The correction also belonged in the record, not only in the
        final sentence, because the wrong version had already been reported.
    - type: constrain
      what: >-
        Required the five tests that pin the README claim.
      why: >-
        Prose drifts when paths and commands are renamed; a test that fails when the section loses
        `pip install -e ".[dev]"` or `python -m eval.run` keeps the diagnostic honest without a
        reviewer having to re-read it.
  transcript: TBD


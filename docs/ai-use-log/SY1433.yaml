- id: AI-2026-11-23-003
  date: 2026-11-23
  members: ["SY1433"]
  agent: opencode
  summary: >-
    CHG-055: add .github/scripts/adr_status_check.py and test/offline/test_adr_status.py (16 tests).
    An accepted ADR that names the pull request which carried it must cite one with a record under
    docs/review-memo/. The check is deliberately narrow: it parses both "- Status:" and
    "- **Status:**", exempts the ten inherited ADRs that name no PR, does not verify proposed
    records, and counts only `PR #<n>` and `PR-<n>` as citations. It caught ADR-016 citing "PR-3", an
    unrelated 2026-10-12 pull request, which this change corrects to PR #60. Not wired into ci.yml,
    so no gate behaviour changed.
  human_interventions:
    - type: approve
      what: >-
        Approved adding the validator at all, and approved the narrow rule after a read-only survey
        of the corpus showed the broad version would misfire.
      why: >-
        An accepted ADR is evidence that a decision was reviewed; a citation that does not resolve
        breaks the chain from decision to review. The narrow rule was chosen because a strict version
        would flag the ten inherited records that predate the convention and bury the real defect.
    - type: constrain
      what: >-
        Kept the checker out of ci.yml rather than making it a seventh gate.
      why: >-
        Adding a gate changes branch protection and the required-check list; that decision should be
        made separately, not as a side effect of writing a script.
